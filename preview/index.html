<!--
  The Hall of Records: private preview for Sarah Breskman Cosme. Built by LightStorm; not public.

  The rule this page keeps: Sarah is never AI-generated. She is her real photo (a cutout lying over the
  pyramid loop), and that photo dissolves into gold light here, in code, before anything else moves.
  Everything after it is environment only:
    1. hero     the pyramid loop (media/hall-hero-mobile.mp4) with Sarah's real cutout on top
    2. tap      she dissolves into gold dust; the loop settles onto its first frame (Kling clip 1's start frame)
    3. journey  media/hall-transition-mobile.mp4 (Kling clip 1 + clip 2, joined) when it exists; until
                then the same beats are staged in code: the camera pushes to the pyramid's base, a seam
                of light opens in it, and you pass through
    4. landing  the Hall of Records loop (media/hall-landing-mobile.mp4, whose first frame is clip 2's
                last frame), with the three doorways as the buttons
  ?auto starts the journey by itself after 3.5 s (hands-free screen recording); ?sim forces the staged
  journey even when the transition video is there.
-->
<style>
  :root {
    --ink: #0b0a1a;
    --ivory: #f6eedd;
    --gold-1: #f7e6b0;
    --gold-2: #d9b25f;
    --navy: #0d1d38;
    --gold-text: linear-gradient(180deg, #fff3cf 0%, #f0d38a 38%, #c9973f 70%, #f3dc9c 100%);
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--ivory); overflow: hidden; }
  body { font-family: "Cormorant Garamond", Georgia, serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  .view { position: fixed; left: 0; top: 0; width: 100%; height: 100svh; overflow: hidden; background: var(--ink); }   /* the page never scrolls */

  /* stages: fixed-size boxes in the media's own pixels, scaled to cover the screen */
  .stage, .hallStage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .cam { position: absolute; inset: 0; will-change: transform; }
  .cam.drift { animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.035); } }
  .plate, .her { position: absolute; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .plate { left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  video.plate { transition: opacity .6s ease; }
  .is-hidden { opacity: 0; }
  .her { transition: opacity 1.7s var(--ease), filter 1.7s var(--ease); }
  .her.go { opacity: 0; filter: brightness(1.7) saturate(.6); }

  /* the staged journey: dusk deepening and a seam of light opening in the pyramid (opacity/transform only) */
  .dusk { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background:
      radial-gradient(60% 18% at var(--gx, 50%) var(--gy, 70%), rgba(255, 176, 96, .45), transparent 70%),
      linear-gradient(180deg, rgba(12, 12, 40, .85) 0%, rgba(30, 22, 60, .55) 35%, rgba(70, 40, 40, .3) 60%, rgba(10, 8, 20, .8) 100%); }
  .slit { position: absolute; width: 16px; height: 130px; margin-left: -8px; margin-top: -130px; opacity: 0; pointer-events: none;
    left: var(--gx, 50%); top: var(--gy, 70%); transform-origin: 50% 100%; transform: scaleY(.2);
    background: radial-gradient(50% 50% at 50% 60%, #fff 0%, #ffe9b0 30%, rgba(255, 200, 110, .5) 60%, transparent 100%);
    box-shadow: 0 0 40px 18px rgba(255, 210, 130, .45), 0 0 120px 40px rgba(127, 214, 255, .2); }
  .bloom { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .7s ease;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 70%), #fffaf0 0%, #ffe6ad 30%, #f2c46c 60%, #c88b3a 100%); }
  .bloom.on { opacity: 1; }

  .tv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; background: #0b0a1a; }
  .keep { position: absolute; inset: 0; background: rgba(0, 0, 0, .01); pointer-events: none; }   /* keeps iOS off a stall-prone video path */

  /* legibility veils */
  .veil { position: absolute; inset: 0; pointer-events: none; transition: opacity 1.2s ease; }
  .veil.top { background: linear-gradient(180deg, rgba(11, 9, 30, .72) 0%, rgba(11, 9, 30, .35) 20%, rgba(11, 9, 30, 0) 36%); }
  .veil.bottom { background: linear-gradient(0deg, rgba(10, 8, 20, .7) 0%, rgba(10, 8, 20, .25) 16%, rgba(10, 8, 20, 0) 30%); }
  .desk .veil.top { background: linear-gradient(170deg, rgba(11, 9, 30, .75) 0%, rgba(11, 9, 30, .35) 28%, rgba(11, 9, 30, 0) 50%); }
  .gone { opacity: 0 !important; }

  /* ---------- the Hall of Records ---------- */
  .hall { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: #05081a; }
  .hall.on { opacity: 1; pointer-events: auto; }
  .hall .side { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.45); display: none; }
  .desk .hall .side { display: block; }
  .hallStage { width: 1080px; height: 1920px; }
  .hallStage video, .hallStage img.hp { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hallVeil { position: absolute; left: 0; right: 0; top: 0; height: 30%; pointer-events: none;
    background: linear-gradient(180deg, rgba(4, 8, 24, .82) 0%, rgba(4, 8, 24, .5) 45%, rgba(4, 8, 24, 0) 100%); }
  .hallVeil.low { top: auto; bottom: 0; height: 14%; background: linear-gradient(0deg, rgba(4, 8, 24, .7), rgba(4, 8, 24, 0)); }

  /* the doorways: each button is the arch itself, its words in the light */
  .door { position: absolute; background: none; border: 0; color: var(--navy); cursor: pointer; font: inherit;
    border-radius: 999px 999px 0 0 / 46% 46% 0 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding: 0 18px 64px; text-align: center; opacity: 0; transform: translateY(24px);
    transition: opacity 1.2s var(--ease), transform 1.2s var(--ease); }
  .door::before { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity .5s ease;
    background: radial-gradient(70% 60% at 50% 70%, rgba(255, 255, 255, .55), rgba(190, 240, 255, .18) 60%, transparent 100%); }
  .door:hover::before, .door.lit::before { opacity: 1; }
  .door b, .door small { position: relative; display: block; text-shadow: 0 0 18px rgba(255, 255, 255, .9), 0 0 4px rgba(255, 255, 255, .7); }
  .door b { font: 600 31px/1.15 "Cinzel", serif; letter-spacing: .1em; text-transform: uppercase; }
  .door small { margin-top: 12px; font-style: italic; font-weight: 500; font-size: 33px; line-height: 1.2; color: #173052; }
  .door:focus-visible { outline: 3px solid var(--gold-1); outline-offset: 6px; }
  .hall.doors-on .door { opacity: 1; transform: none; }
  .hall.doors-on .door:nth-of-type(1) { transition-delay: .5s; }
  .hall.doors-on .door:nth-of-type(2) { transition-delay: .25s; }
  .hall.doors-on .door:nth-of-type(3) { transition-delay: .75s; }

  .dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- the hero copy ---------- */
  .title { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 7svh); text-align: center; padding: 0 20px; pointer-events: none; }
  .desk .title { left: 6vw; right: auto; top: 10vh; text-align: left; max-width: 36vw; padding: 0; }
  .eyebrow { font-family: "Cinzel", serif; font-weight: 500; font-size: 11px; letter-spacing: .38em; text-transform: uppercase; color: var(--gold-1); opacity: .92; }
  .desk .eyebrow { font-size: 13px; }
  h1 { margin: 14px 0 12px; font-family: "Cinzel", serif; font-weight: 500; text-transform: uppercase; line-height: 1.04; letter-spacing: .06em;
    font-size: min(8.6vw, 44px); background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 14px rgba(0, 0, 0, .45)); }
  h1 span { display: block; }
  h1 .first { font-size: .78em; letter-spacing: .22em; }
  .desk h1 { font-size: min(3.9vw, 66px); }
  .tagline { font-style: italic; font-size: 21px; letter-spacing: .02em; color: var(--ivory); text-shadow: 0 1px 12px rgba(0, 0, 0, .6); }
  .desk .tagline { font-size: 26px; }
  .rule { display: block; width: 72px; height: 1px; margin: 16px auto 0; background: linear-gradient(90deg, transparent, var(--gold-2), transparent); }
  .desk .rule { margin-left: 0; background: linear-gradient(90deg, var(--gold-2), transparent); }

  .title > * { opacity: 0; transform: translateY(10px); transition: opacity 1.6s var(--ease), transform 1.6s var(--ease); }
  .ready .title > * { opacity: 1; transform: none; }
  .ready .title > :nth-child(2) { transition-delay: .25s; }
  .ready .title > :nth-child(3) { transition-delay: .7s; }
  .ready .title > :nth-child(4) { transition-delay: .9s; }
  .leaving .title > * { opacity: 0; transform: translateY(-8px); transition: opacity .7s ease, transform .9s ease; transition-delay: 0s; }

  .begin { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 8.5svh); transform: translate(-50%, 12px);
    font: 500 12.5px/1 "Cinzel", serif; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-1);
    padding: 17px 26px 16px 30px; border: 1px solid rgba(240, 211, 138, .65); border-radius: 999px; cursor: pointer;
    background: rgba(12, 10, 28, .4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: inset 0 0 18px rgba(240, 211, 138, .12);
    opacity: 0; pointer-events: none; transition: opacity 1.2s var(--ease), transform 1.2s var(--ease), background .3s ease; white-space: nowrap; }
  .desk .begin { left: 6vw; bottom: auto; top: calc(10vh + 300px); transform: translate(0, 12px); }
  .begin.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); animation: halo 3.2s ease-in-out 1.2s infinite; }
  .desk .begin.show { transform: translate(0, 0); }
  .begin:active { background: rgba(240, 211, 138, .16); }
  .begin:focus-visible { outline: 1px solid var(--gold-1); outline-offset: 4px; }
  @keyframes halo { 0%, 100% { box-shadow: inset 0 0 18px rgba(240, 211, 138, .12); }
                    50% { box-shadow: 0 0 28px 2px rgba(240, 211, 138, .32), inset 0 0 22px rgba(240, 211, 138, .2); } }
  .leaving .begin { opacity: 0; pointer-events: none; animation: none; transition: opacity .5s ease; }

  /* ---------- the landing copy ---------- */
  .landing { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 6svh); text-align: center; padding: 0 16px; pointer-events: none; }
  .landing > * { opacity: 0; transform: translateY(12px); transition: opacity 1.4s var(--ease), transform 1.4s var(--ease); }
  .landing.on > * { opacity: 1; transform: none; }
  .landing.on > :nth-child(2) { transition-delay: .3s; }
  .landing.on > :nth-child(3) { transition-delay: .6s; }
  .landing h2 { margin: 12px 0 8px; font: 500 min(6.3vw, 46px)/1.1 "Cinzel", serif; letter-spacing: .08em; text-transform: uppercase;
    background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 12px rgba(0, 0, 0, .6)); }
  .landing .lede { font-style: italic; font-size: 19px; color: #ece6d8; text-shadow: 0 1px 10px rgba(3, 8, 26, .95); }
  .credit { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 2.6svh); text-align: center;
    font: 400 9.5px/1 "Cinzel", serif; letter-spacing: .32em; text-transform: uppercase; color: rgba(240, 220, 170, .72);
    text-shadow: 0 1px 8px rgba(0, 0, 0, .8); opacity: 0; transition: opacity 1.4s ease 2s; pointer-events: none; }
  .credit.on { opacity: 1; pointer-events: auto; }
  .credit button { background: none; border: 0; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; text-transform: inherit; padding: 6px; }
  .note { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 6.5svh); transform: translateX(-50%); font-style: italic; font-size: 15px;
    color: #f3ecdc; text-shadow: 0 1px 10px rgba(0, 0, 0, .9); opacity: 0; transition: opacity .5s ease; white-space: nowrap; pointer-events: none; }
  .note.on { opacity: .95; }

  @media (prefers-reduced-motion: reduce) {
    .cam.drift, .begin.show { animation: none; }
  }
</style>
</head>
<body>
<main class="view" id="view">
  <!-- 3. the transition (Kling clip 1 + clip 2, joined): under the hero, visible, so iOS draws it -->
  <video class="tv" id="tv" muted playsinline preload="none" tabindex="-1" aria-hidden="true"></video>
  <div class="keep" hidden id="keep"></div>

  <!-- 1. the hero: the pyramid loop, Sarah's real photo on top -->
  <div class="stage" id="stage">
    <div class="cam drift" id="cam">
      <img class="plate" id="plateStill" alt="" decoding="async">
      <video class="plate is-hidden" id="plateVid" muted loop playsinline preload="auto" tabindex="-1" aria-hidden="true"></video>
      <img class="her" id="her" alt="Sarah Breskman Cosme at the Pyramid of Khafre, Giza" decoding="async">
    </div>
  </div>
  <div class="dusk" id="dusk"></div>
  <div class="slit" id="slit"></div>

  <!-- 4. the Hall of Records, its three doorways the buttons -->
  <div class="hall" id="hall">
    <img class="side" id="hallSide" alt="" aria-hidden="true">
    <div class="hallStage" id="hallStage">
      <img class="hp" id="hallStill" alt="" aria-hidden="true">
      <video id="hallVid" muted loop playsinline preload="none" tabindex="-1" aria-hidden="true"></video>
      <div class="hallVeil"></div><div class="hallVeil low"></div>
      <button class="door" type="button" data-room="Sessions" style="left:55px;top:1067px;width:268px;height:396px">
        <b>Sessions</b><small>QHHT &amp;<br>past lives</small>
      </button>
      <button class="door" type="button" data-room="Courses &amp; Books" style="left:386px;top:983px;width:307px;height:480px">
        <b>Courses<br>&amp; Books</b><small>Atlantis, Avalon<br>&amp; the Sphinx</small>
      </button>
      <button class="door" type="button" data-room="Events &amp; Trips" style="left:756px;top:1067px;width:272px;height:396px">
        <b>Events<br>&amp; Trips</b><small>Live, Egypt<br>&amp; community</small>
      </button>
    </div>
  </div>

  <div class="veil top" id="vTop"></div>
  <div class="veil bottom" id="vBottom"></div>
  <canvas class="dust" id="dust" aria-hidden="true"></canvas>
  <div class="bloom" id="bloom"></div>

  <header class="title" id="title">
    <p class="eyebrow">The Holistic Hypnotist</p>
    <h1><span class="first">Sarah</span><span>Breskman Cosme</span></h1>
    <p class="tagline">Remember who you are.</p>
    <span class="rule"></span>
  </header>
  <button class="begin" id="begin" type="button">Begin the journey</button>

  <section class="landing" id="landing" aria-label="The Hall of Records">
    <p class="eyebrow">Beneath the plateau</p>
    <h2>The Hall of Records</h2>
    <p class="lede">Every soul keeps a record. Choose your doorway.</p>
  </section>
  <p class="credit" id="credit">Private preview · Site by LightStorm · <button type="button" id="replay">Replay</button></p>
  <p class="note" id="note"></p>
</main>

<script>
// The Hall of Records journey, built on the lessons of TREV's and Jenn's sites:
//  - the transition is fetched whole into memory once the hero is up, and only load()ed, never
//    played-and-paused to warm it up (that froze its picture on iOS) [TREV]
//  - it sits visible under the hero (an invisible video is never drawn on iOS); the hero only lifts once
//    the video is really drawing; an all-but-invisible layer sits over it while it plays [TREV]
//  - it starts inside the tap, so Low Power Mode can't block it. Its first 1.8 s are a still of clip 1's
//    first frame (baked into the file), so nothing in the AI clip moves until Sarah's real photo has
//    dissolved on top [LightStorm rule]
//  - stall and frozen-picture watchdogs, and safety timers from the tap and from 'playing' [TREV, Jenn]
//  - it crossfades into the Hall loop over its last 1.5 s, both moving, the loop restarted on its first
//    frame (the frame the transition ends on) [Jenn]; the diamond then eases up to its full spin
//  - a video's first frame is a plain <img> under it (iOS ignores object-fit on a poster), and a loop
//    only shows once it's really playing, so Low Power Mode just keeps the still [Jenn, TREV]
//  - every full-bleed layer shares one framing; the page never scrolls; media carry a cache-buster
(() => {
  "use strict";
  const MV = "?v=4";   // bump whenever a video or still is replaced, or phones keep the old file
  const SETS = {
    mobile:  { w: 1080, h: 1920, still: "media/hall-hero-mobile.jpg", loop: "media/hall-hero-mobile.mp4",
               her: "media/sarah-cutout-mobile.webp", cut: { x: 554, y: 1114, w: 444, h: 806 },
               base: [474, 1430], fx: 0.52, fy: 0.5, video: "media/hall-transition-mobile.mp4" },
    desktop: { w: 1920, h: 1080, still: "media/hall-hero-desktop.jpg", loop: "",
               her: "media/sarah-cutout-desktop.webp", cut: { x: 1089, y: 556, w: 289, h: 524 },
               base: [720, 850], fx: 0.5, fy: 0.55, video: "" },   // desktop: staged until there's a 16:9 transition
  };
  const HALL = { w: 1080, h: 1920, still: "media/hall-landing-mobile.jpg", loop: "media/hall-landing-mobile.mp4", fx: 0.5, fy: 0.62 };
  const DISSOLVE_MS = 1750;       // Sarah's dissolve (the transition's baked hold is 1.8 s, so it's always longer)
  const CROSSFADE_S = 1.5;        // transition -> Hall loop
  const ENTER_WAIT_MS = 4000;     // a tap waits this long for the transition to draw, then stages it instead
  const START_FALLBACK_MS = 12000, PLAY_FALLBACK_MS = 4000;   // + the video's own length

  const Q = new URLSearchParams(location.search);
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const view = $("view"), stage = $("stage"), cam = $("cam"), plateStill = $("plateStill"), plateVid = $("plateVid"), her = $("her");
  const dusk = $("dusk"), slit = $("slit"), tv = $("tv"), keep = $("keep"), bloom = $("bloom");
  const hall = $("hall"), hallStage = $("hallStage"), hallVid = $("hallVid"), hallStill = $("hallStill"), hallSide = $("hallSide");
  const begin = $("begin"), landing = $("landing"), credit = $("credit"), note = $("note");
  const timers = [], intervals = [];
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  const every = (fn, ms) => { const t = setInterval(fn, ms); intervals.push(t); return t; };
  const stopAll = () => { timers.splice(0).forEach(clearTimeout); intervals.splice(0).forEach(clearInterval); };

  let set = null, fit = { s: 1, ox: 0, oy: 0 }, phase = "hero", tvSrc = "", blobUrl = "";

  // a loop only shows once it's really playing; until then (or in Low Power Mode) its still shows
  function showWhenPlaying(v) {
    v.classList.add("is-hidden");
    const on = () => { if (v.currentTime > 0) { v.classList.remove("is-hidden"); v.removeEventListener("timeupdate", on); } };
    v.addEventListener("timeupdate", on);
  }
  // runs fn once the video has really put a frame on screen
  function onFirstFrame(v, fn) {
    let done = false; const go = () => { if (!done) { done = true; fn(); } };
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(go);
    const t = () => { if (v.currentTime > 0.05) { v.removeEventListener("timeupdate", t); go(); } };
    v.addEventListener("timeupdate", t);
  }

  // ---------- layout ----------
  function cover(W, H, w, h, fx, fy) {
    const s = Math.max(W / w, H / h);
    return { s, ox: Math.min(0, Math.max(W - w * s, W / 2 - fx * w * s)), oy: Math.min(0, Math.max(H - h * s, H / 2 - fy * h * s)) };
  }
  function choose() {
    const W = view.clientWidth, H = view.clientHeight;   // the stage's own size, never the live window
    const next = W / H < 0.9 ? SETS.mobile : SETS.desktop;
    document.documentElement.classList.toggle("desk", next === SETS.desktop);
    if (next !== set && phase === "hero") {
      set = next;
      stage.style.width = set.w + "px"; stage.style.height = set.h + "px";
      plateStill.src = set.still + MV; her.src = set.her + MV;
      Object.assign(her.style, { left: set.cut.x + "px", top: set.cut.y + "px", width: set.cut.w + "px", height: set.cut.h + "px" });
      cam.style.transformOrigin = `${set.base[0]}px ${set.base[1]}px`;
      if (set.loop) { plateVid.hidden = false; plateVid.src = set.loop + MV; showWhenPlaying(plateVid); plateVid.play().catch(() => {}); }
      else { plateVid.hidden = true; plateVid.removeAttribute("src"); }
      tvSrc = ""; if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = ""; } tv.removeAttribute("src");
    }
    fit = cover(W, H, set.w, set.h, set.fx, set.fy);
    stage.style.transform = `translate(${fit.ox.toFixed(1)}px, ${fit.oy.toFixed(1)}px) scale(${fit.s.toFixed(5)})`;
    tv.style.objectPosition = `${(set.fx * 100).toFixed(1)}% ${(set.fy * 100).toFixed(1)}%`;   // one framing for every layer
    const hf = W / H < 0.9 ? cover(W, H, HALL.w, HALL.h, HALL.fx, HALL.fy)
                           : (() => { const s = H / HALL.h; return { s, ox: (W - HALL.w * s) / 2, oy: 0 }; })();
    hallStage.style.transform = `translate(${hf.ox.toFixed(1)}px, ${hf.oy.toFixed(1)}px) scale(${hf.s.toFixed(5)})`;
    if (!hallStill.getAttribute("src")) { hallStill.src = HALL.still + MV; hallSide.src = HALL.still + MV; }
    dust.resize();
  }

  // ---------- media warm-up, once the hero is up ----------
  function warmUp() {
    // the transition: whole into memory, then load() only
    if (set.video && !Q.has("sim")) {
      const want = set, url = set.video + MV;
      fetch(url).then((r) => (r.ok && (r.headers.get("content-type") || "").includes("video") ? r.blob() : Promise.reject()))
        .then((b) => { if (want !== set || phase !== "hero") return; blobUrl = URL.createObjectURL(b); tv.src = tvSrc = blobUrl; tv.preload = "auto"; tv.load(); })
        .catch(() => {})
        .finally(() => { hallVid.src = HALL.loop + MV; hallVid.preload = "auto"; hallVid.load(); });   // then the hall
    } else { hallVid.src = HALL.loop + MV; hallVid.preload = "auto"; hallVid.load(); }
  }

  // ---------- gold dust: ambient motes, and Sarah dissolving into light ----------
  const dust = (() => {
    const cv = $("dust"), ctx = cv.getContext("2d");
    let dpr = 1, W = 0, H = 0, motes = [], burst = [], raf = 0, last = 0, tint = "gold";
    const sprite = (r, g, b) => {
      const c = document.createElement("canvas"); c.width = c.height = 32;
      const x = c.getContext("2d"), gr = x.createRadialGradient(16, 16, 0, 16, 16, 16);
      gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.25, `rgba(${r},${g},${b},.9)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
      x.fillStyle = gr; x.fillRect(0, 0, 32, 32); return c;
    };
    const GOLD = sprite(244, 205, 120), BLUE = sprite(150, 220, 255);
    function resize() { dpr = Math.min(devicePixelRatio || 1, 2); W = view.clientWidth; H = view.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    function seedMotes(n) {
      motes = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.5,
        vx: (Math.random() - .5) * 6, vy: -(3 + Math.random() * 8), a: .12 + Math.random() * .4, p: Math.random() * 6.28 }));
    }
    function release(img, rect) {
      const k = 6, w = Math.max(1, Math.round(img.naturalWidth / k)), h = Math.max(1, Math.round(img.naturalHeight / k));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h);
      let data; try { data = x.getImageData(0, 0, w, h).data; } catch (e) { return; }
      const pts = [];
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (data[(j * w + i) * 4 + 3] > 170) pts.push([i / w, j / h]);
      const max = W < 700 ? 650 : 900;
      for (let n = 0; n < max && pts.length; n++) {
        const [u, v] = pts[(Math.random() * pts.length) | 0];
        burst.push({ x: rect.left + (u + (Math.random() - .5) / w) * rect.width, y: rect.top + (v + (Math.random() - .5) / h) * rect.height,
          vx: (Math.random() - .5) * 30, vy: -(18 + Math.random() * 60), r: .7 + Math.random() * 1.9,
          t: -(0.15 + (1 - v) * .35 + Math.random() * .9), life: 1.3 + Math.random() * 1.6, p: Math.random() * 6.28 });
      }
    }
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      const spr = tint === "blue" ? BLUE : GOLD;
      for (const m of motes) {
        m.p += dt; m.x += (m.vx + Math.sin(m.p * .7) * 4) * dt; m.y += m.vy * dt;
        if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
        const s = m.r * 6; ctx.globalAlpha = m.a * (.6 + .4 * Math.sin(m.p * 1.3)); ctx.drawImage(spr, m.x - s / 2, m.y - s / 2, s, s);
      }
      for (let i = burst.length - 1; i >= 0; i--) {
        const b = burst[i]; b.t += dt; if (b.t < 0) continue;
        if (b.t > b.life) { burst.splice(i, 1); continue; }
        const u = b.t / b.life; b.p += dt * 3;
        b.x += (b.vx + Math.sin(b.p) * 14) * dt; b.y += b.vy * dt; b.vy *= (1 - .25 * dt);
        const s = b.r * 6 * (1 - u * .4); ctx.globalAlpha = Math.min(1, b.t * 5) * (1 - u) * .95;
        ctx.drawImage(GOLD, b.x - s / 2, b.y - s / 2, s, s);
      }
      ctx.globalAlpha = 1;
    }
    return {
      resize, release,
      start(n) { resize(); seedMotes(n); if (!raf) raf = requestAnimationFrame(frame); },
      hall() { tint = "blue"; seedMotes(W < 700 ? 40 : 70); },
      quiet() { motes = []; },
      reset() { tint = "gold"; burst = []; seedMotes(W < 700 ? 30 : 46); },
    };
  })();

  // ---------- the hero ----------
  function whenLoaded(img) { return img.complete && img.naturalWidth ? Promise.resolve() : new Promise((r) => { img.onload = r; img.onerror = r; }); }
  function heroUp() {
    Promise.all([whenLoaded(plateStill), whenLoaded(her)])
      .then(() => Promise.all([plateStill.decode?.().catch(() => {}), her.decode?.().catch(() => {})]))
      .then(() => {
        view.classList.add("ready");
        dust.start(view.clientWidth < 700 ? 30 : 46);
        later(() => begin.classList.add("show"), REDUCED ? 300 : 2000);
        later(warmUp, 1200);
        if (Q.has("auto")) later(go, 3500);
      });
  }

  // ---------- the journey ----------
  function go() {
    if (phase !== "hero") return;
    phase = "dissolve";
    view.classList.add("leaving");
    // the transition starts now, inside the tap: its first 1.8 s are a still of the hero's first frame
    let drawing = false;
    const useVideo = !!set.video && !Q.has("sim");
    if (useVideo) {
      if (!tvSrc) { tv.src = tvSrc = set.video + MV; tv.load(); }   // not in memory yet: from the network
      keep.hidden = false;
      onFirstFrame(tv, () => { drawing = true; });
      tv.play().catch(() => {});
    }
    // Sarah's real photo dissolves into gold light, in code; the loop settles onto its first frame
    if (!REDUCED) dust.release(her, her.getBoundingClientRect());
    her.classList.add("go");
    later(() => { plateVid.classList.add("is-hidden"); }, 600);
    later(() => {
      her.hidden = true; plateVid.pause();
      if (!useVideo) return staged();
      const t0 = performance.now();
      const lift = () => {
        if (drawing) return playing();
        if (performance.now() - t0 > ENTER_WAIT_MS) { tv.pause(); keep.hidden = true; return staged(); }
        later(lift, 100);
      };
      lift();
    }, REDUCED ? 900 : DISSOLVE_MS);
  }

  // the transition is drawing: lift the hero off it (identical frame underneath), watch it, hand over to the Hall
  function playing() {
    phase = "video";
    stage.style.visibility = "hidden"; veils(false); dust.quiet();
    const dur = tv.duration || 9;
    // watchdogs: a stalled clock (resume, then nudge once), or a picture that stopped while the clock runs
    let lastT = -1, still = 0, kicked = false, frames = 0, lastFrames = -1, frozen = 0;
    const countFrames = () => { frames++; if (tv.requestVideoFrameCallback && phase === "video") tv.requestVideoFrameCallback(countFrames); };
    if (tv.requestVideoFrameCallback) tv.requestVideoFrameCallback(countFrames);
    every(() => {
      if (phase !== "video") return;
      const t = tv.currentTime;
      if (t === lastT && !tv.ended) {
        still += 250;
        if (still === 750) tv.play().catch(() => {});
        if (still === 1500 && !kicked) { kicked = true; try { tv.currentTime = t + 0.05; } catch (e) { /* ignore */ } tv.play().catch(() => {}); }
        if (still >= 3000) arrive(true);
      } else still = 0;
      if (tv.requestVideoFrameCallback && t > 0.3 && t !== lastT) {   // the clock runs but no new picture
        frozen = frames === lastFrames ? frozen + 250 : 0;
        if (frozen >= 1500) arrive(true);
      }
      lastT = t; lastFrames = frames;
      if (dur && t >= dur - CROSSFADE_S) arrive(true);
    }, 250);
    tv.onended = () => arrive(true);
    later(() => arrive(true), dur * 1000 + PLAY_FALLBACK_MS);
  }

  // staged in code (desktop, ?sim, or if the transition can't play): push to the pyramid's base, a seam of light opens in it, through
  function staged() {
    if (phase === "staged" || phase === "landing") return;
    phase = "staged";
    stage.style.visibility = "";
    const cs = getComputedStyle(cam).transform;
    cam.classList.remove("drift"); cam.style.transform = cs === "none" ? "" : cs;
    cam.style.transformOrigin = `${set.base[0]}px ${set.base[1]}px`;
    void cam.offsetWidth;
    const T = REDUCED ? 1.2 : 4.2;
    cam.style.transition = `transform ${T}s cubic-bezier(.45,0,.75,1)`;
    cam.style.transform = `scale(${REDUCED ? 1.1 : 2.4})`;
    dusk.style.transition = `opacity ${T * .8}s ease-in`; dusk.style.opacity = "1";
    veils(false);
    const b = set.base, gx = (fit.ox + b[0] * fit.s) / view.clientWidth * 100 + "%", gy = (fit.oy + b[1] * fit.s) / view.clientHeight * 100 + "%";
    [dusk, slit, bloom].forEach((el) => { el.style.setProperty("--gx", gx); el.style.setProperty("--gy", gy); });
    later(() => { slit.style.transition = `opacity 1.2s ease, transform ${T * .55}s cubic-bezier(.3,0,.2,1)`; slit.style.opacity = "1"; slit.style.transform = "scaleY(1.5)"; }, T * 380);
    later(() => bloom.classList.add("on"), T * 1000 - 500);
    later(() => { arrive(false); bloom.style.transition = "opacity 1.6s ease"; later(() => bloom.classList.remove("on"), 150); }, T * 1000 + 300);
  }

  // the Hall: its loop restarts on the frame the transition ends on and fades in over it, both moving;
  // the diamond starts slow and eases up to its full spin; then the words and the doorways rise
  function arrive(fromVideo) {
    if (phase === "landing") return;
    phase = "landing";
    try { hallVid.currentTime = 0; } catch (e) { /* not loaded yet: the still shows */ }
    hallVid.playbackRate = REDUCED ? 1 : 0.3;
    showWhenPlaying(hallVid);
    hallVid.play().catch(() => {});
    if (!REDUCED) { const t0 = performance.now(); const iv = every(() => {
      const u = Math.min(1, (performance.now() - t0) / 2600); hallVid.playbackRate = 0.3 + 0.7 * (1 - Math.pow(1 - u, 2)); if (u >= 1) clearInterval(iv); }, 100); }
    hall.classList.add("on"); dust.hall();
    later(() => {
      stage.style.visibility = "hidden"; dusk.style.opacity = "0"; slit.style.opacity = "0";
      if (fromVideo) { keep.hidden = true; tv.pause(); }
    }, CROSSFADE_S * 1000 + 200);
    later(() => { landing.classList.add("on"); hall.classList.add("doors-on"); credit.classList.add("on"); }, fromVideo ? 1100 : 700);
  }

  function veils(on) { ["vTop", "vBottom"].forEach((id) => $(id).classList.toggle("gone", !on)); }

  // the doorways: in the preview they glow and say where they lead
  document.querySelectorAll(".door").forEach((d) => d.addEventListener("click", () => {
    document.querySelectorAll(".door").forEach((x) => x.classList.toggle("lit", x === d));
    note.textContent = `${d.dataset.room}: this doorway opens in the full build`;
    note.classList.add("on"); clearTimeout(note._t); note._t = setTimeout(() => note.classList.remove("on"), 2600);
  }));

  function replay() {
    stopAll();
    phase = "hero";
    view.classList.remove("leaving"); landing.classList.remove("on"); credit.classList.remove("on"); begin.classList.remove("show");
    hall.classList.remove("on", "doors-on"); hallVid.pause(); hallVid.playbackRate = 1; bloom.classList.remove("on"); bloom.style.transition = "";
    her.hidden = false; her.classList.remove("go");
    stage.style.visibility = ""; cam.style.transition = "none"; cam.style.transform = ""; cam.classList.add("drift");
    cam.style.transformOrigin = `${set.base[0]}px ${set.base[1]}px`;
    dusk.style.transition = "none"; dusk.style.opacity = "0";
    slit.style.transition = "none"; slit.style.opacity = "0"; slit.style.transform = "";
    tv.pause(); tv.onended = null; keep.hidden = true; try { tv.currentTime = 0; } catch (e) { /* ignore */ }
    if (set.loop) { plateVid.currentTime = 0; showWhenPlaying(plateVid); plateVid.play().catch(() => {}); }
    veils(true); dust.reset();
    later(() => begin.classList.add("show"), 1600);
  }

  begin.addEventListener("click", go);
  $("replay").addEventListener("click", replay);
  addEventListener("resize", () => choose());
  choose();
  heroUp();
})();
</script>
</body>
</html>
